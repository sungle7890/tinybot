; tinybot firmware - Phase 1 (hardware bring-up)
; Board decision: docs/05-open-questions.md Q1 = A (ESP32-S3 standalone)

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform  = espressif32@6.12.0
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed  = 115200
upload_speed   = 921600
monitor_filters = time, colorize

build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    pololu/VL53L0X@^1.3.1

; Arduino core 3.x (pioarduino fork) also builds - the LEDC calls in
; src/drive/motors.cpp are version-guarded. To switch:
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
; Pinned to the official 6.12.0 / Arduino 2.0.17 for now: proven combination.

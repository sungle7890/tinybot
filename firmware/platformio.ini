; tinybot firmware - Phase 1 (hardware bring-up)
;
; Two targets. Platform differences live behind src/hal/; everything above it
; is shared. See docs/05-open-questions.md for the board decision.
;
;   uno_r4_wifi  the board already on hand. Cooperative 50 Hz loop.
;   esp32s3      the BOM board. Real RTOS task pinned to its own core.

[platformio]
default_envs = uno_r4_wifi

[env]
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize
build_flags = -Wall -Wextra
lib_deps = pololu/VL53L0X@^1.3.1

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
; The renesas-ra platform still defaults to toolchain 1.70201.0, which ships
; x86_64-only macOS binaries and dies with "Bad CPU type in executable" on
; Apple Silicon. This is the oldest release that has a darwin_arm64 build.
platform_packages = platformio/toolchain-gccarmnoneeabi@~1.100301.0
; Upload through the onboard CMSIS-DAP probe with pyOCD. The default sam-ba
; route uses bossac, and the bossac PlatformIO ships is x86_64-only, so it cannot
; run on Apple Silicon without Rosetta. OpenOCD reaches the probe but has no
; RA4M1 flash driver. pyOCD does, via Renesas' pack - one-time setup:
;   uv tool install pyocd && pyocd pack install r7fa4m1ab
; --base-address 0x4000 with sector erase leaves the bootloader at 0x0000-0x3FFF
; and the EEPROM data flash untouched.
upload_protocol = custom
upload_command = pyocd flash -t r7fa4m1ab --base-address 0x4000 --erase sector $SOURCE
build_src_filter = +<*> -<hal/hal_esp32.cpp>
; newlib-nano leaves out float formatting unless asked, and without it every
; %f in console output prints as an empty string.
build_flags = ${env.build_flags} -DTINYBOT_PLATFORM_R4=1 -Wl,-u,_printf_float

[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
upload_speed = 921600
build_src_filter = +<*> -<hal/hal_r4.cpp>
build_flags = ${env.build_flags} -DTINYBOT_PLATFORM_ESP32=1 -DCORE_DEBUG_LEVEL=1
